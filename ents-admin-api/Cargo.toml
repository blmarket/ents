[package]
name = "ents-admin-api"
description = "HTTP API for ents entity administration"
license = "MIT OR Apache-2.0"
version = "0.4.0"
edition = "2021"
authors = ["blmarket@gmail.com"]
homepage = "https://github.com/blmarket/ents"
repository = "https://github.com/blmarket/ents"

[features]
default = ["sqlite"]
sqlite = ["dep:ents-sqlite", "dep:r2d2", "dep:r2d2_sqlite"]

[dependencies]
ents.workspace = true
ents-admin.workspace = true
ents-sqlite = { workspace = true, optional = true }

axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tower-http = { version = "0.6", features = ["cors", "fs"] }
r2d2 = { version = "0.8.10", optional = true }
r2d2_sqlite = { version = "0.32.0", optional = true }

[dev-dependencies]
ents-sqlite.workspace = true
ents-test-suite.workspace = true
r2d2 = "0.8.10"
r2d2_sqlite = "0.32.0"
tempfile = "3"
